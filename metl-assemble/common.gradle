import org.apache.tools.ant.filters.FixCrLfFilter
import org.apache.tools.ant.filters.ReplaceTokens
import java.text.SimpleDateFormat
import java.util.Date

ext {
    GPL_LICENSE = 'GNU GPL version 3.0'
    COMMERCIAL_LICENSE = 'Commercial'
}

    group = 'org.jumpmind.metl'
    apply plugin: 'idea'    
    apply plugin: 'eclipse-wtp'
    apply plugin: 'java'
    apply plugin: 'java-library'
	apply plugin: 'jacoco'
	
	if (!project.name.equals("metl-com") && !project.name.equals("metl-core") && !project.name.equals("metl-server") && !project.name.equals("metl-ui")) {
		ext {
		    origVersion = version
		    pluginBuildNumber = buildNumber = 'a'.equals(buildNumber) ?  ('a.' + new SimpleDateFormat("yyyyMMddHHmm").format(new Date())) : buildNumber
		}
	
		buildNumber = 'a'.equals(buildNumber) ?  ('a.' + new SimpleDateFormat("yyyyMMddHHmm").format(new Date())) : buildNumber
		version = version + "." + buildNumber
	}
	def licenseName = null
	
    sourceCompatibility=JavaVersion.VERSION_21
    targetCompatibility=JavaVersion.VERSION_21
    
    def pluginRepositoryDir = null
    // From metl-com every path runs through metl-com-assemble/../../metl, so classify by where the
    // component really lives: a component outside the metl repository (metl-com/comp-*) is commercial.
    def metlRepositoryDir = buildscript.sourceFile.canonicalFile.parentFile.parentFile
    def isCommercialComponent = projectDir.canonicalFile.parentFile != metlRepositoryDir
    if (project.name.startsWith('comp-') && isCommercialComponent) {
        licenseName = COMMERCIAL_LICENSE
        pluginRepositoryDir = "../../metl/metl-war/build/plugins"
    } else if (project.name.startsWith('comp') || project.name.startsWith('resource')) {
        licenseName = GPL_LICENSE
        pluginRepositoryDir = "../metl-war/build/plugins"
    } else if (project.name.equals("metl-core") || project.name.equals("metl-server") || project.name.equals("metl-ui")
        || project.name.equals("metl-com")) {
        licenseName = project.name.equals("metl-com") ? COMMERCIAL_LICENSE : GPL_LICENSE
    }

    if (licenseName != null) {
        apply plugin: 'maven-publish'
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    pom {
                        name = project.name
                        description = 'ETL Data Integration'
                        url = 'https://github.com/jumpmindinc/metl'
                        licenses {
                            license {
                                name = licenseName
                                if (licenseName == GPL_LICENSE) {
                                    url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                                }
                            }
                        }
                        developers {
                            developer {
                                name = 'Jumpmind'
                                organization = 'Jumpmind'
                                organizationUrl = 'https://www.jumpmind.com'
                            }
                        }
                        scm {
                            url = 'https://github.com/jumpmindinc/metl'
                            connection = 'scm:git:https://github.com/jumpmindinc/metl.git'
                            developerConnection = 'scm:git:ssh://git@github.com/jumpmindinc/metl.git'
                        }
                    }
                }
            }
            if (pluginRepositoryDir != null) {
                repositories {
                    maven {
                        url = pluginRepositoryDir
                    }
                }
            }
        }
        // Commercial modules stay out of the public repository.
        if (licenseName == GPL_LICENSE && rootProject.pluginManager.hasPlugin('com.jumpmind.saturn.publish')) {
            apply plugin: 'com.jumpmind.saturn.publish'
        }
    }

    ext {
        majorMinorVersion = version.substring(0, version.indexOf(".", version.indexOf(".")+ 1))
    }    
    
    def saturnUrl = providers.gradleProperty('saturnUrl')
            .orElse('https://saturn.dev.cp-nonprod.jumpmind.cloud').get().replaceAll('/+$', '')
    repositories {
        // uncomment this if you want to use your local maven repository to test undelivered
        /// changes (like symmetricds changes)
        //mavenLocal()
        // jlibs only, from the same Saturn as settings.gradle; first, so a SoapUI repository outage
        // (it answered 502) can no longer fail the build
        maven {
            url = "${saturnUrl}/files/maven/releases/"
            allowInsecureProtocol = saturnUrl.startsWith('http://')
            content { includeGroup 'jlibs' }
        }
        mavenCentral()
        maven { url "https://maven.vaadin.com/vaadin-addons" }
        maven { url "https://plugins.gradle.org/m2" }
        maven { url "https://www.soapui.org/repository/maven2" }
        maven { url "https://github.com/santhosh-tekuri/maven-repository/raw/master" }
        jcenter()
        maven { url "https://www2.ph.ed.ac.uk/maven2" }
        // last, Gradle stops at a repository that answers with a server error instead of trying the next one
        maven { url "https://repository.jboss.org/nexus/content/repositories/deprecated" }
    }     
     
    
    configurations { 
        deployerJars
        testArtifacts.extendsFrom testImplementation
        all {
            // check for updates every build
            resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
            resolutionStrategy.force 'net.java.dev.jna:jna:5.14.0', 'net.java.dev.jna:jna-platform:5.14.0'
            // symmetricds 3.18 brings in logback and spring boot 4 brings in log4j-to-slf4j, metl logs through log4j
            exclude group: 'ch.qos.logback'
            exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        }
    }
    
    dependencies {
        deployerJars "org.apache.maven.wagon:wagon-ssh:3.5.3"
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    task testJar(type: Jar) {
        archiveClassifier = "test"
        from sourceSets.test.output
    }    
    
    artifacts { testArtifacts testJar }
    
    if (JavaVersion.current().isJava8Compatible()) {
      allprojects {
        tasks.withType(Javadoc) {
          options.addStringOption('Xdoclint:none', '-quiet')
          options.addStringOption("sourcepath", "")
          // Javadoc writes its run date into every page; without it two builds differ.
          options.addBooleanOption('notimestamp', true)
        }
      }
    }       
    
    jar {
        manifest {
            attributes("Implementation-Title": project.name,
                       "Implementation-Version": version,
                       "Project-Artifact": project.name,                       
                       "Build-Version": version,
                       "Build-Scm-Version": gitVersion,
                       "Build-Scm-Branch": gitBranch)
        }    
    }    
    
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    test {
        // A release passes -PfailOnTestFailure=true so a failing test stops it.
        ignoreFailures = !providers.gradleProperty('failOnTestFailure').map { it.toBoolean() }.getOrElse(false)
    }
    
    dependencies {
        testImplementation "org.mockito:mockito-all:$mockitoVersion"
        testImplementation "org.powermock:powermock-api-mockito:$powerMockVersion"
        testImplementation "org.powermock:powermock-module-junit4:$powerMockVersion"
        testImplementation "xmlunit:xmlunit:$xmlunitVersion"   
    }    

    eclipse {
        classpath {
            downloadSources = true
            downloadJavadoc = false
        }        
        
        project.file.whenMerged { project ->
            project.natures.remove('org.springsource.ide.eclipse.gradle.core.nature')
            project.natures.remove('org.eclipse.buildship.core.gradleprojectnature')            
        }
    }   
    
    eclipse.project.file.withXml { provider ->
      ignoreDerivedResources(provider.asNode())
    }
 
    def ignoreDerivedResources(projectDescription, directories = ["target", "test-output"]) {
      def count = directories.count { file(it).exists() }
      if (count > 0) {
        def filter = projectDescription
          .appendNode("filteredResources")
          .appendNode("filter")
        filter.appendNode("id", System.currentTimeMillis().toString().trim())
        filter.appendNode("type", "26")
        filter.appendNode("name")
        def matcher = filter.appendNode("matcher")
        matcher.appendNode("id", "org.eclipse.ui.ide.orFilterMatcher")
        def arguments = matcher.appendNode("arguments")
        directories.each {
          if (file(it).exists()) {
            def dirMatcher = arguments.appendNode("matcher")
            dirMatcher.appendNode("id", "org.eclipse.ui.ide.multiFilter")
            dirMatcher.appendNode("arguments", "1.0-projectRelativePath-matches-false-false-${it}")
          }
        }
      }
    }    
       
    task develop {
        description 'Generates Eclipse artifacts and sets up your development environment'
        dependsOn tasks.cleanEclipse, tasks.cleanEclipseWtp, tasks.eclipse, tasks.eclipseWtp
    }
    
    task wrapper(type: Wrapper) {
        gradleVersion = '2.8'
    }    
