pluginManagement {
    // One property points the plugin's resolution and its deploys at the same Saturn.
    def saturnUrl = providers.gradleProperty('saturnUrl')
            .orElse('https://downloads.jumpmind.com').get().replaceAll('/+$', '')
    def saturnMavenUrl = "${saturnUrl}/files/maven/releases/"
    repositories {
        // Saturn serves only the Saturn plugins and the Portal never does: a Saturn plugin version
        // missing on Saturn must fail the build instead of resolving from a public repository.
        maven {
            url = saturnMavenUrl
            allowInsecureProtocol = saturnMavenUrl.startsWith('http://')
            content { includeGroupByRegex 'com\\.jumpmind\\.saturn(\\..*)?' }
        }
        gradlePluginPortal {
            content { excludeGroupByRegex 'com\\.jumpmind\\.saturn(\\..*)?' }
        }
    }
}

